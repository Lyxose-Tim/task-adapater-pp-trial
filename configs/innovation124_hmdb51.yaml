defaults: innovation124.yaml

experiment:
  name: innovation124_hmdb51
  message: hmdb51_5way_1shot_available_data

model:
  checkpoint: ../dataset/checkpoints/ViT-B-16.pt

data:
  name: hmdb51
  root: ../dataset/HMDB51
  corpus: ../corpus/classes_hmdb51_fsar.yml
  splits:
    train: ../dataset/HMDB51/annotations/train.txt
    val: ../dataset/HMDB51/annotations/val.txt
    test: ../dataset/HMDB51/annotations/test.txt

corpus_v2:
  enabled: false

output:
  root: ../outputs/innovation124/hmdb51
  run_metrics: ../outputs/innovation124/hmdb51/run_metrics.csv
